# Recreating a container gives it a new IP. Without `resolve`, nginx keeps the address it
# saw at startup and serves 502 until it is restarted, which would break every deploy.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream place_api {
    zone place_api 64k;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # former API Gateway stage: one port carries HTTP and the WebSocket upgrade
    location = /ws {
        proxy_pass http://place_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /place.png {
        proxy_pass http://place_api/place.png;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        proxy_pass http://place_api/healthz;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
